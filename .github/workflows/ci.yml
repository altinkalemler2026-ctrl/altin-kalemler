name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Typecheck, Lint, Tests, DB Chain, SQL QA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: yarisma-programi
      CONTAINER: supabase_db_yarisma-programi
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node (pinned to local validated version)
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      # ----------------------------------------------------------
      # Kalite kapilari: pahali Supabase baslangicindan ONCE kosar,
      # boylece tip/lint/test hatasi runner dakikasi harcamaz.
      # ----------------------------------------------------------

      - name: TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: ESLint (gorev kapsami)
        run: npm run lint:faz3

      - name: Vitest birim/bilesen testleri (integration hariç)
        run: npm run test:unit

      # ----------------------------------------------------------
      # Local Supabase: saglik kontrolu + temiz migration zinciri.
      # Secret gerektirmez; yalnizca yerel gelistirme varsayilanlarini
      # kullanir. Hata durumunda anlasilir teshis loglari basilir.
      # ----------------------------------------------------------

      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@v1
        with:
          # Yerelde dogrulanmis surum. Yalnizca CLI kurulumu: token,
          # login/link/db push ve herhangi bir production baglantisi YOK.
          version: 2.115.0

      - name: Verify Supabase CLI
        run: |
          set -euo pipefail
          if ! command -v supabase >/dev/null 2>&1; then
            echo "::error::supabase CLI kurulmus degil (PATH'te yok)."
            exit 1
          fi
          supabase --version

      - name: Start local Supabase
        id: sbstart
        run: supabase start

      - name: Supabase health check
        id: sbhealth
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 60); do
            if docker exec "$CONTAINER" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ok=1
              echo "Supabase DB hazir (deneme $i)."
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Supabase DB 120 saniye icinde hazir olmadı."
            exit 1
          fi

      - name: Diagnostics on Supabase failure
        if: failure() && (steps.sbstart.conclusion == 'failure' || steps.sbhealth.conclusion == 'failure')
        run: |
          set +e
          echo "===== supabase status ====="
          supabase status --debug || true
          echo "===== docker ps -a ====="
          docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "===== db container logs (son 100) ====="
          docker logs "$CONTAINER" --tail 100 2>&1 || true

      - name: Reset database (temiz migration zinciri 001-072)
        run: supabase db reset

      - name: Assert migration chain and subjects grant
        run: |
          set -euo pipefail
          docker exec -i "$CONTAINER" psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -At <<'SQL'
          do $$
          declare
            v_mig int;
            v_final boolean;
          begin
            -- 001..072 arasinda 050 numarali dosya repoda yoktur -> 71.
            select count(*) into v_mig from supabase_migrations.schema_migrations;
            if v_mig <> 71 then
              raise exception 'MIGRATION_CHAIN_FAIL: beklenen 71 migrasyon, bulunan %', v_mig
                using errcode = 'P0001';
            end if;
            select exists (
              select 1 from supabase_migrations.schema_migrations
               where version = '072' and name = 'subjects_read_grant'
            ) into v_final;
            if not v_final then
              raise exception 'MIGRATION_CHAIN_FAIL: son migrasyon (072 subjects_read_grant) uygulanmamis'
                using errcode = 'P0001';
            end if;
            if not has_table_privilege('authenticated', 'public.subjects', 'SELECT') then
              raise exception 'GRANT_FAIL: authenticated -> public.subjects SELECT izni yok (072)'
                using errcode = 'P0001';
            end if;
            if has_table_privilege('anon', 'public.subjects', 'SELECT') then
              raise exception 'GRANT_FAIL: anon -> public.subjects SELECT izni KALDIRILMAMIS (072)'
                using errcode = 'P0001';
            end if;
          end $$;
          select 'CHAIN_OK';
          SQL

      # ----------------------------------------------------------
      # SQL QA suretleri: Faz 1 / Faz 2 / Faz 3.
      # - Faz 3 kendi icinde FAIL durumunda exception firlatir
      #   (psql ON_ERROR_STOP ile exit != 0) ve "TAMAM: kalan=0"
      #   satiri basar.
      # - Faz 1/2 exception firlatmadigi icin cikti ayristirilir:
      #   son satir "toplam|gecen|kalan" ozeti olmali, kalan=0 ve
      #   hicbir "|FAIL|" satiri bulunmamali.
      # ----------------------------------------------------------

      - name: Run SQL QA suites (Faz 1, 2, 3)
        run: |
          set -euo pipefail
          run_suite () {
            local name="$1" file="$2" kind="$3"
            local base
            base=$(basename "$file")
            echo "----- $file -----"
            docker cp "$file" "$CONTAINER:/tmp/$base"
            set +e
            docker exec "$CONTAINER" psql -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -q -A -t -f "/tmp/$base" > "/tmp/${name}.out" 2>&1
            local rc=$?
            set -e
            cat "/tmp/${name}.out"
            if [ "$rc" -ne 0 ]; then
              echo "::error::$file SQL hatasiyla durdu (exit=$rc)."
              exit 1
            fi
            if [ "$kind" = "self-raising" ]; then
              grep -q 'QA FAZ 3 TAMAM: kalan=0' "/tmp/${name}.out" || {
                echo "::error::$file basari isareti yok."
                exit 1
              }
            else
              if grep -q '|FAIL|' "/tmp/${name}.out"; then
                echo "::error::$file icinde FAIL satirlari var."
                exit 1
              fi
              local line tot gecen kalan
              line=$(tail -n 1 "/tmp/${name}.out")
              IFS='|' read -r tot gecen kalan <<< "$line"
              [[ "$tot" =~ ^[0-9]+$ ]] && [[ "$gecen" =~ ^[0-9]+$ ]] && [[ "$kalan" =~ ^[0-9]+$ ]] || {
                echo "::error::$file ozet satiri ayristirilamadi: '$line'"
                exit 1
              }
              if [ "$kalan" -ne 0 ] || [ "$gecen" -ne "$tot" ]; then
                echo "::error::$file basarisiz: toplam=$tot gecen=$gecen kalan=$kalan"
                exit 1
              fi
              echo "$file OK: toplam=$tot gecen=$gecen kalan=$kalan"
            fi
          }

          run_suite faz1 scripts/qa_faz1_local_validation.sql parsed
          run_suite faz2 scripts/qa_faz2_local_validation.sql parsed
          run_suite faz3 scripts/qa_faz3_local_validation.sql self-raising

      # ----------------------------------------------------------
      # Faz 2 paralel sayaç probe'u: iki AYRI docker exec sureci ile
      # gercek isletim-sistemi paralelligi (bash job control, & + wait).
      # Windows PowerShell bagimliligi yoktur.
      # ----------------------------------------------------------

      - name: Parallel counter probe (Faz 2)
        run: |
          set -euo pipefail
          PROBE=qa_faz2_parallel_probe.sql
          PSQL="docker exec $CONTAINER psql -U postgres -d postgres -v ON_ERROR_STOP=1 -A -t"

          probe_mode () {
            local mode="$1" tag="${2:-}" log="$3"
            if [ -n "$tag" ]; then
              docker cp "scripts/$PROBE" "$CONTAINER:/tmp/$PROBE"
              $PSQL -v MODE="$mode" -v TAG="$tag" -f "/tmp/$PROBE" > "$log" 2>&1
            else
              docker cp "scripts/$PROBE" "$CONTAINER:/tmp/$PROBE"
              $PSQL -v MODE="$mode" -f "/tmp/$PROBE" > "$log" 2>&1
            fi
          }

          require_marker () {
            local log="$1" marker="$2" label="$3"
            if ! grep -q "$marker" "$log"; then
              cat "$log"
              echo "::error::Probe ($label): beklenen isaret yok: $marker"
              exit 1
            fi
            echo "Probe $label OK ($marker)"
          }

          echo "== FARKLI-KULLANICI modu (work): C ve D eszamanli =="
          probe_mode setup "" /tmp/probe_setup.log
          require_marker /tmp/probe_setup.log SETUP_OK setup

          probe_mode work a /tmp/probe_work_a.log &
          PA=$!
          probe_mode work b /tmp/probe_work_b.log &
          PB=$!
          wait "$PA" || { cat /tmp/probe_work_a.log; echo "::error::work/a isci basarisiz."; exit 1; }
          wait "$PB" || { cat /tmp/probe_work_b.log; echo "::error::work/b isci basarisiz."; exit 1; }
          grep -h 'FINAL_USED=' /tmp/probe_work_a.log /tmp/probe_work_b.log || true

          probe_mode verify "" /tmp/probe_verify_work.log
          require_marker /tmp/probe_verify_work.log VERIFY_PASS verify-work
          grep 'FINAL_USED=' /tmp/probe_work_a.log /tmp/probe_work_b.log || true

          probe_mode cleanup "" /tmp/probe_cleanup1.log
          require_marker /tmp/probe_cleanup1.log CLEANUP_OK cleanup-1

          echo "== AYNI-KULLANICI modu (same): iki isci ayni sayaç C =="
          probe_mode setup "" /tmp/probe_setup2.log
          require_marker /tmp/probe_setup2.log SETUP_OK setup-2

          probe_mode same a /tmp/probe_same_a.log &
          SA=$!
          probe_mode same b /tmp/probe_same_b.log &
          SB=$!
          wait "$SA" || { cat /tmp/probe_same_a.log; echo "::error::same/a isci basarisiz."; exit 1; }
          wait "$SB" || { cat /tmp/probe_same_b.log; echo "::error::same/b isci basarisiz."; exit 1; }
          grep -h 'FINAL_USED=' /tmp/probe_same_a.log /tmp/probe_same_b.log || true

          probe_mode verify "" /tmp/probe_verify_same.log
          require_marker /tmp/probe_verify_same.log VERIFY_PASS verify-same

          probe_mode cleanup "" /tmp/probe_cleanup2.log
          require_marker /tmp/probe_cleanup2.log CLEANUP_OK cleanup-2

      # ----------------------------------------------------------
      # Tam test paketi: integration dahil (calisan local Supabase
      # uzerinden gercek RPC akisi).
      # ----------------------------------------------------------

      - name: Vitest full (integration dahil)
        run: npm test

      - name: Summary
        if: always()
        run: |
          echo "CI adimlari tamamlandi: tsc, eslint(scope), vitest(unit), supabase start+health, db reset(001-072), QA f1/f2/f3, parallel probe(work+same), vitest(full)."
